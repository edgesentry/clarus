version: 2
updates:
  - package-ecosystem: npm
    directory: /analytics
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 10
    groups:
      npm-analytics-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # dompurify@3.2.7 is pinned by @scalar/api-reference via monaco-editor@0.55.1.
      # No patched version resolvable until @scalar/api-reference upgrades monaco-editor.
      # Mitigated locally via npm overrides (dompurify >= 3.4.0 in package.json).
      - dependency-name: dompurify
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 10
    groups:
      npm-ui-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /edge
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 5
    groups:
      cargo-edge-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /ui/src-tauri
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 5
    groups:
      cargo-tauri-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
